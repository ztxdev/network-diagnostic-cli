name: Feature request
description: Suggest a diagnostic capability
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: Diagnostic scenario
      description: What real troubleshooting situation would this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Show an example command or output if possible.
    validations:
      required: true
